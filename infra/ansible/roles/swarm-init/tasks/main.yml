---
# Check Swarm status
- name: Check if Swarm is already initialized
  ansible.builtin.shell: docker info --format '{{"{{"}}.Swarm.LocalNodeState{{"}}"}}'
  register: swarm_status
  changed_when: false
  failed_when: false

# Leave swarm if in an error state (force)
- name: Leave swarm if in error state
  ansible.builtin.command: docker swarm leave --force
  when: swarm_status.stdout == 'error'

# Re-check status after leave if needed
- name: Re-check Swarm status after force leave
  ansible.builtin.shell: docker info --format '{{"{{"}}.Swarm.LocalNodeState{{"}}"}}'
  register: swarm_status_recheck
  changed_when: false
  failed_when: false
  when: swarm_status.stdout == 'error'

# Update swarm_status if recheck ran
- name: Update swarm_status if recheck was performed
  set_fact:
    swarm_status: "{{ swarm_status_recheck }}"
  when: swarm_status_recheck is not skipped

# Initialize Swarm on the first manager if not active
- name: Initialize Docker Swarm on manager
  ansible.builtin.command: >
    docker swarm init
    --advertise-addr {{ ansible_default_ipv4.address }}
  when:
    - inventory_hostname in groups['swarm_managers']
    - swarm_status.stdout is defined
    - swarm_status.stdout != 'active'
  register: swarm_init
  changed_when: "'Swarm initialized' in swarm_init.stdout"
# Get worker join token (from first manager only)
- name: Get worker join token
  ansible.builtin.command: docker swarm join-token -q worker
  register: worker_token
  when: inventory_hostname == groups['swarm_managers'][0]
  changed_when: false
  run_once: true

# Test network connectivity from workers to manager before joining
- name: Test connectivity to manager port 2377
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['swarm_managers'][0]]['ansible_default_ipv4']['address'] }}"
    port: 2377
    timeout: 10
    state: started
  when:
    - inventory_hostname in groups['swarm_workers']
    - swarm_status.stdout != 'active'
  register: connectivity_test
  failed_when: false

- name: Display connectivity test result
  ansible.builtin.debug:
    msg: "{{ 'Manager reachable on port 2377' if connectivity_test.failed is false else 'WARNING: Cannot reach manager on port 2377 - check security groups/firewall' }}"
  when:
    - inventory_hostname in groups['swarm_workers']
    - connectivity_test is defined

# Join workers if not already active
- name: Join worker to Swarm
  ansible.builtin.command: >
    docker swarm join
    --token {{ hostvars[groups['swarm_managers'][0]]['worker_token']['stdout'] }}
    {{ hostvars[groups['swarm_managers'][0]]['ansible_default_ipv4']['address'] }}:2377
  when:
    - inventory_hostname in groups['swarm_workers']
    - swarm_status.stdout != 'active'
  register: join_result
  failed_when: false
  changed_when: "'This node joined a swarm' in join_result.stdout"

# Display join result for debugging
- name: Display worker join result
  ansible.builtin.debug:
    msg:
      - "Join command output: {{ join_result.stdout if join_result.stdout is defined else 'N/A' }}"
      - "Join command error: {{ join_result.stderr if join_result.stderr is defined else 'N/A' }}"
      - "Return code: {{ join_result.rc if join_result.rc is defined else 'N/A' }}"
  when:
    - inventory_hostname in groups['swarm_workers']
    - join_result is defined

# Wait for workers to settle
- name: Wait for workers to join
  ansible.builtin.pause:
    seconds: 15
  when: inventory_hostname in groups['swarm_workers']

# Verify worker status is active
- name: Verify worker joined successfully
  ansible.builtin.shell: docker info --format '{{"{{"}}.Swarm.LocalNodeState{{"}}"}}'
  register: final_status
  until: final_status.stdout == 'active'
  retries: 6
  delay: 10
  when: inventory_hostname in groups['swarm_workers']
  changed_when: false

# Show detailed diagnostics on fail
- name: Gather diagnostic information on failure
  ansible.builtin.shell: |
    echo "=== Docker Swarm Info ==="
    docker info | grep -A 10 Swarm || true
    echo ""
    echo "=== Docker Version ==="
    docker version --format '{{.Server.Version}}' || true
    echo ""
    echo "=== Network Connectivity ==="
    nc -zv {{ hostvars[groups['swarm_managers'][0]]['ansible_default_ipv4']['address'] }} 2377 2>&1 || true
    echo ""
    echo "=== Recent Docker Logs ==="
    journalctl -u docker -n 20 --no-pager || true
  register: diagnostics
  when:
    - inventory_hostname in groups['swarm_workers']
    - final_status.stdout != 'active'
  failed_when: false

- name: Display worker join failure diagnostics
  ansible.builtin.debug:
    msg: |
      ==========================================
      Worker Join Failed - Diagnostics
      ==========================================
      Worker status: {{ final_status.stdout }}
      Manager IP: {{ hostvars[groups['swarm_managers'][0]]['ansible_default_ipv4']['address'] }}

      Common causes:
      1. Security Groups: Port 2377/tcp not open between workers and manager
      2. Network ACLs: Blocking traffic between subnets
      3. Docker daemon: Not running or in error state
      4. Previous swarm membership: Node needs 'docker swarm leave --force'

      Connectivity test result: {{ 'PASS' if connectivity_test.failed is false else 'FAIL - Cannot reach manager on port 2377' }}

      {{ diagnostics.stdout if diagnostics is defined else '' }}
      ==========================================
  when:
    - inventory_hostname in groups['swarm_workers']
    - final_status.stdout != 'active'

- name: Fail if worker not active
  ansible.builtin.fail:
    msg: "Worker failed to join swarm. See diagnostics above."
  when:
    - inventory_hostname in groups['swarm_workers']
    - final_status.stdout != 'active'

# Show nodes on manager
- name: Verify Swarm cluster nodes
  ansible.builtin.command: docker node ls
  register: node_list
  when: inventory_hostname in groups['swarm_managers']
  changed_when: false
  retries: 3
  delay: 8
  until: node_list.rc == 0

- name: Display Swarm cluster nodes
  ansible.builtin.debug:
    msg: "{{ node_list.stdout_lines }}"
  when:
    - inventory_hostname in groups['swarm_managers']
    - node_list is defined