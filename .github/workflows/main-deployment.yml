name: Deploy WordPress Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  terraform-apply:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    outputs:
      manager_ip: ${{ steps.terraform-output.outputs.manager_ip }}
      worker_ips: ${{ steps.terraform-output.outputs.worker_ips }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action != 'destroy'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        id: terraform-output
        if: github.event.inputs.action != 'destroy'
        run: |
          echo "manager_ip=$(terraform output -raw manager_public_ip)" >> $GITHUB_OUTPUT
          echo "worker_ips=$(terraform output -json worker_public_ips)" >> $GITHUB_OUTPUT

      - name: Save SSH Key
        if: github.event.inputs.action != 'destroy'
        run: |
          terraform output -raw private_key > swarm-key.pem
          chmod 600 swarm-key.pem

      - name: Upload SSH Key
        if: github.event.inputs.action != 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: infra/terraform/swarm-key.pem
          retention-days: 1

      - name: Generate Ansible Inventory
        if: github.event.inputs.action != 'destroy'
        run: |
          terraform output -raw ansible_inventory > ../ansible/inventory/hosts.ini

      - name: Upload Ansible Inventory
        if: github.event.inputs.action != 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: infra/ansible/inventory/hosts.ini
          retention-days: 1

  ansible-configure:
    name: Configure Swarm Cluster
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event.inputs.action != 'destroy'
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Download SSH Key
        uses: actions/download-artifact@v4
        with:
          name: ssh-key
          path: ~/.ssh/

      - name: Set SSH Key Permissions
        run: chmod 600 ~/.ssh/swarm-key.pem

      - name: Download Ansible Inventory
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory
          path: infra/ansible/inventory/

      - name: Wait for EC2 instances
        run: sleep 60

      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory/hosts.ini playbooks/site.yml

  deploy-wordpress:
    name: Deploy WordPress Stack
    runs-on: ubuntu-latest
    needs: ansible-configure
    if: github.event.inputs.action != 'destroy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SSH Key
        uses: actions/download-artifact@v4
        with:
          name: ssh-key
          path: ~/.ssh/

      - name: Set SSH Key Permissions
        run: chmod 600 ~/.ssh/swarm-key.pem

      - name: Download Ansible Inventory
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory
          path: ./

      - name: Extract Manager IP
        id: manager
        run: |
          MANAGER_IP=$(grep -A1 '[swarm_managers]' hosts.ini | tail -1 | awk '{print $1}')
          echo "ip=$MANAGER_IP" >> $GITHUB_OUTPUT

      - name: Copy Docker Stack
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/swarm-key.pem stack-app/docker-stack.yml ubuntu@${{ steps.manager.outputs.ip }}:/tmp/

      - name: Deploy Docker Stack
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/swarm-key.pem ubuntu@${{ steps.manager.outputs.ip }} << 'ENDSSH'
            echo "${{ secrets.MYSQL_ROOT_PASSWORD }}" | docker secret create mysql_root_password - 2>/dev/null || true
            echo "${{ secrets.MYSQL_PASSWORD }}" | docker secret create mysql_password - 2>/dev/null || true
            docker stack deploy -c /tmp/docker-stack.yml wordpress
            sleep 30
            docker stack ps wordpress
          ENDSSH

      - name: Verify Deployment
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/swarm-key.pem ubuntu@${{ steps.manager.outputs.ip }} "docker service ls && docker stack ps wordpress"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [terraform-apply, ansible-configure, deploy-wordpress]
    if: always() && github.event.inputs.action != 'destroy'
    steps:
      - name: Create Summary
        run: |
          echo "## WordPress Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manager IP:** ${{ needs.terraform-apply.outputs.manager_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**WordPress URL:** http://${{ needs.terraform-apply.outputs.manager_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure: ${{ needs.terraform-apply.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration: ${{ needs.ansible-configure.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- WordPress: ${{ needs.deploy-wordpress.result }}" >> $GITHUB_STEP_SUMMARY

  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
