name: PR Validation & Security Scanning

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  yaml-lint:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint --version
          yamllint -f parsable stack-app/*.yml infra/ansible/**/*.yml || true

      - name: Validate Docker Compose syntax
        run: |
          docker compose -f stack-app/docker-stack.yml config > /dev/null
          echo "Docker Compose syntax valid"

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  ansible-syntax-check:
    name: Ansible Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible ansible-lint

      - name: Ansible Syntax Check
        working-directory: infra/ansible
        run: |
          ansible-playbook --syntax-check playbooks/site.yml

      - name: Ansible Lint
        working-directory: infra/ansible
        run: |
          ansible-lint playbooks/ roles/ || true

  security-trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan MySQL Docker image
        run: |
          echo "Scanning MySQL image..."
          docker pull mysql:8.0.35
          docker run --rm aquasec/trivy image --severity HIGH,CRITICAL mysql:8.0.35

      - name: Scan WordPress Docker image
        run: |
          echo "Scanning WordPress image..."
          docker pull wordpress:6.4.2-php8.1-apache
          docker run --rm aquasec/trivy image --severity HIGH,CRITICAL wordpress:6.4.2-php8.1-apache

  security-secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  shell-script-validation:
    name: Shell Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [yaml-lint, terraform-validate, ansible-syntax-check, security-trivy-scan, security-secrets-scan, python-tests, shell-script-validation]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## PR Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "All security scans and validation checks completed" >> $GITHUB_STEP_SUMMARY
